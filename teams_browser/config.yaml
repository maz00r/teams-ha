name: Teams (przeglądarka na telefon)
version: "0.1.1"
slug: teams_browser
description: Microsoft Teams w przeglądarce działającej na serwerze HA, z panelem dopasowanym do telefonu i powiadomieniami push.
url: https://github.com/maz00r/teams-ha
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:microsoft-teams
panel_title: Teams
homeassistant_api: true
hassio_api: true
options:
  notify_service: ""
  ntfy_topic: ""
  notify_preview: true
  quiet_hours: ""
  external_url: ""
  screen_width: 1000
  screen_height: 2160
  scale: 2
  start_url: "https://teams.microsoft.com/v2/"
  log_level: "info"
schema:
  notify_service: str?
  ntfy_topic: str?
  notify_preview: bool
  quiet_hours: str?
  external_url: str?
  screen_width: int(320,2400)
  screen_height: int(480,4000)
  scale: float(1,3)
  start_url: url
  log_level: list(debug|info|warn|error)
